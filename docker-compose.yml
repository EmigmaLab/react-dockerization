name: mapper-fe
services:
  fe:
    image: mapper-fe
    ports:
      - "127.0.0.1:${FE_PORT}:3000"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_ONLYOFFICE_URL: ${NEXT_PUBLIC_ONLYOFFICE_URL}
    env_file:
      - .env
    environment:
      BASE_URL: ${BASE_URL}
      NEXT_PUBLIC_ONLYOFFICE_URL: ${NEXT_PUBLIC_ONLYOFFICE_URL}

    
